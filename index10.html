
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Escolar</title>
    <link rel="stylesheet" href="CSS/style10.css">
    <script src="JS/script10.js"></script>
</head>
<body>

<header>
    <h1>Sistema de Gestão Escolar</h1>
    <p>Gerenciamento de estudantes e desempenho acadêmico</p>
</header>

<nav>
    <button onclick="mostrar('inicio')">Início</button>
    <button onclick="mostrar('cadastro')">Estudantes</button>
    <button onclick="mostrar('relatorios')">Relatórios</button>
</nav>

<main>
    <section id="inicio">
        <h2>Painel de Indicadores</h2>
        <div id="indicadores"></div>
    </section>

    <section id="cadastro" hidden>
        <h2>Cadastro de Estudantes</h2>

        <input type="hidden" id="id">

        <input id="nome" placeholder="Nome do estudante">
        <input id="matricula" placeholder="Matrícula">
        <input id="turma" placeholder="Turma">
        <input id="curso" placeholder="Curso">

        <input id="nota1" type="number" min="0" max="10" step="0.1" placeholder="Nota 1">
        <input id="nota2" type="number" min="0" max="10" step="0.1" placeholder="Nota 2">

        <input id="faltas" type="number" min="0" placeholder="Quantidade de faltas">
        <input id="aulas" type="number" min="1" placeholder="Total de aulas">

        <button onclick="salvarAluno()">Salvar estudante</button>
        <button onclick="limparFormulario()">Limpar</button>

        <h3>Pesquisar estudantes</h3>
        <input id="pesquisa" placeholder="Digite o nome ou matrícula"
               oninput="listar()">

        <select id="filtroTurma" onchange="listar()">
            <option value="">Todas as turmas</option>
        </select>

        <div id="lista"></div>
    </section>

    <section id="relatorios" hidden>
        <h2>Relatório Escolar</h2>
        <div id="relatorio"></div>
        <button onclick="window.print()">Imprimir relatório</button>
    </section>
</main>


</body>
</html>

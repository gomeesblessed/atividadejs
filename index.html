
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Escolar</title>
    <script src="JS/script.js"></script>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="container">

        <h1>Calculadora de Média</h1>

        <label>Nome do aluno:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label>Primeira nota:</label>
        <input type="number" id="nota1" min="0" max="10" step="any">

        <label>Segunda nota:</label>
        <input type="number" id="nota2" min="0" max="10" step="any">

        <label>Terceira nota:</label>
        <input type="number" id="nota3" min="0" max="10" step="any">

        <button type="button" onclick="calcularMedia()">
            Calcular Média
        </button>

        <div id="resultado"></div>

    </div>


</body>
</html>

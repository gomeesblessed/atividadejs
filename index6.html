
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="CSS/style6.css">
    <script src="JS/script6.js"></script>
</head>
<body>
    <div class="container">
        <h1>Controle de Estoque</h1>

        <h3>Cadastrar produto</h3>

        <input id="produto" placeholder="Nome do produto">
        <input id="codigo" placeholder="Código">
        <input id="quantidade" type="number" placeholder="Quantidade">
        <input id="preco" type="number" step="0.01" placeholder="Preço unitário">

        <button onclick="cadastrar()">Cadastrar</button>

        <hr>

        <h3>Movimentação</h3>

        <input id="codigoMovimento" placeholder="Código do produto">
        <input id="quantidadeMovimento" type="number" placeholder="Quantidade">

        <button onclick="entrada()">Entrada</button>
        <button onclick="saida()">Saída</button>

        <h3>Produtos em estoque</h3>
        <div id="lista"></div>

        <h3 id="valorTotal">Valor total: R$ 0,00</h3>
    </div>

    
</body>
</html>

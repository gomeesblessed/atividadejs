
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="CSS/style4.css">
     <script src="JS/script4.js"></script>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Alunos</h1>

        <input id="nome" placeholder="Nome do aluno">
        <input id="idade" type="number" placeholder="Idade">
        <input id="curso" placeholder="Curso">
        <input id="matricula" placeholder="Matrícula">

        <button onclick="cadastrar()">Cadastrar Aluno</button>

        <h3>Alunos cadastrados</h3>
        <div id="lista"></div>
        <p id="total">Total: 0 alunos</p>
    </div>

</body>
</html>
